[package]
name = "now-playing-flagger"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
env_logger = "0.11.11"
log = "0.4.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2.9.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-normalization = "0.1.25"
urlencoding = "2.1.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Com"] }
windows-future = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = "0.3.33"
zbus = { version = "5.18.0", features = ["tokio"] }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = ["codegen"] }

# Vendored tray-icon 0.24.1 with a small Linux-only patch: AppIndicator trays ignore
# `set_tooltip` upstream, so hovering the icon showed only the app name. The patch maps the
# tooltip onto the indicator title, which Cinnamon (and others) show on hover. See
# vendor/tray-icon/PATCHED.md -- re-apply when Tauri moves to a newer tray-icon.
[patch.crates-io]
tray-icon = { path = "vendor/tray-icon" }
